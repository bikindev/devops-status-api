name: Build and Push Docker Image

on:
  push:
    branches:
      - main

# Permissão obrigatória para autenticar e publicar no GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Ler versão da aplicação
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '\r\n ')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Versão detectada: $VERSION"

      - name: Normalizar nome do repositório/owner para minúsculas
        run: |
          # GHCR exige que a URL da imagem esteja estritamente em letras minúsculas
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/status-api"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE_NAME }}:latest